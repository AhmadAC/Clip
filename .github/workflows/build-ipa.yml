name: Build iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # Step 1: Check out repository code
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Step 2: Set up Xcode and environment
      - name: Set up Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version

      # Step 3: Build Clip Xcode Workspace (Unsigned for Sideloading)
      - name: Build Xcode Workspace
        run: |
          xcodebuild -workspace Clip.xcworkspace \
            -scheme Clip \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      # Step 4: Create Payload & Package .ipa
      - name: Package Payload into IPA
        run: |
          mkdir -p build/IPA/Payload
          
          # Find and copy Clip.app from the build products
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "Clip.app" -type d)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Clip.app not found!"
            exit 1
          fi
          
          cp -R "$APP_PATH" build/IPA/Payload/
          cd build/IPA
          zip -r Clip-unsigned.ipa Payload
          echo "IPA successfully created."

      # Step 5: Upload IPA Artifact
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Clip-IPA
          path: build/IPA/Clip-unsigned.ipa
          retention-days: 14
